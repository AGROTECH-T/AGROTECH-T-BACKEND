name: ci

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax check (infraestructura base, sin BD)
        run: python -m py_compile manage.py config/settings.py config/urls.py
      - name: Proteccion de secretos
        run: |
          test ! -f .env || (echo ".env no debe existir en CI" && exit 1)
          ! grep -riE "password\s*=\s*['\"][^'\"]*[a-z0-9]{4,}" .env.example || true
